# Nginx on the Oracle VM: HTTPS front door for the API only.
#
# Deliberately NO auth_basic here — the app enforces its own APP_USER /
# APP_PASSWORD gate, and it reads the same Authorization header that nginx
# basic-auth would consume; stacking both would lock the frontend out.
# certbot rewrites this file for HTTPS when you run it (deploy/ORACLE.md §5).
server {
    listen 80;
    server_name api.justacquisition.com;      # <-- your real API hostname

    # scripts with pasted signature images run large
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
