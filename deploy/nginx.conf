# Nginx in front of the CRM: the domain, the HTTP->HTTPS jump (certbot adds
# it), and — critically — the basic-auth gate. The app has no login of its
# own; without this stanza anyone who finds the URL can read every lead and
# send mail from the saved Gmail accounts.
server {
    listen 80;
    server_name crm.yourdomain.com;        # <-- your real (sub)domain

    # the gate — see deploy/DEPLOY.md for htpasswd setup
    auth_basic "BSBW CRM";
    auth_basic_user_file /etc/nginx/.crm-users;

    # scripts with pasted signature images run large
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
