# Render blueprint — one web service running the API. The database lives on
# Neon, not on Render: Render's free Postgres expires after 30 days, Neon's
# doesn't. The frontend lives on Vercel and calls this API cross-origin.
#
# Starter, not free, on purpose: Render's free tier blocks outbound SMTP
# ports, so a free service can log in but never send a single email.
#
# In the Render dashboard: New + -> Blueprint -> point it at this repo, then
# fill in the env vars marked sync:false. Full steps: deploy/RENDER.md
services:
  - type: web
    name: bsbw-crm
    runtime: node
    plan: starter
    buildCommand: npm run install:all && npm run build
    # migrate is idempotent — safe on every boot, and it keeps the schema
    # current with the code that just deployed.
    startCommand: npm run migrate && npm --prefix server run start
    # Open (no auth) on purpose: this is what the keep-awake pinger hits.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL        # Neon pooled connection string
        sync: false
      - key: CREDENTIAL_KEY      # openssl rand -hex 32 — seals Gmail app passwords
        sync: false
      - key: ADMIN_EMAIL         # gates creating/deleting organizations
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_USER            # the login the browser asks for — the front door
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: WEB_ORIGIN          # comma list: https://justacquisition.com,https://www.justacquisition.com,https://<app>.vercel.app
        sync: false
