# Render blueprint — one free web service running the API, which also serves
# the built frontend. The database lives on Neon (free), not on Render: Render's
# free Postgres expires after 30 days, Neon's doesn't.
#
# In the Render dashboard: New + -> Blueprint -> point it at this repo, then
# fill in the env vars marked sync:false. Full steps: deploy/RENDER.md
services:
  - type: web
    name: bsbw-crm
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    # migrate is idempotent — safe on every boot, and it keeps the schema
    # current with the code that just deployed.
    startCommand: npm run migrate && npm --prefix server run start
    # Open (no auth) on purpose: this is what the keep-awake pinger hits.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL        # Neon pooled connection string
        sync: false
      - key: CREDENTIAL_KEY      # openssl rand -hex 32 — seals Gmail app passwords
        sync: false
      - key: ADMIN_EMAIL         # gates creating/deleting organizations
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_USER            # the login the browser asks for — the front door
        sync: false
      - key: APP_PASSWORD
        sync: false
